<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login test</title>
</head>
<body>
  <select id="demo-usuario"></select>
  <input type="password" id="contrasena">
  <div id="ayuda-contrasena"></div>
  <div id="alerta-login" class="d-none"></div>
  <button id="btn-submit"></button>
  <form id="form-login"></form>
  <pre id="resultados"></pre>

  <script src="js/util.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>

  <script>
    window.__navegaciones = [];
    try {
      Object.defineProperty(window, "location", {
        value: {
          set href(v) { window.__navegaciones.push(v); },
          get href() { return ""; }
        }
      });
    } catch (error) {
      window.__locationBloqueado = String(error);
    }

    window.addEventListener("DOMContentLoaded", () => {
      const reporte = [];
      try {
        const select = document.getElementById("demo-usuario");
        const contrasena = document.getElementById("contrasena");
        const alerta = document.getElementById("alerta-login");
        const form = document.getElementById("form-login");

        reporte.push("opciones: " + select.options.length);
        if (select.options.length !== 4) reporte.push("FALLO: debería haber 4 cuentas activas");

        const formulario = new FormData(form);
        formulario.set("contrasena", "clave-incorrecta");
        const submitIncorrecto = new SubmitEvent("submit", { bubbles: true, cancelable: true, submitter: document.getElementById("btn-submit") });
        contrasena.value = "clave-incorrecta";
        form.dispatchEvent(submitIncorrecto);
        reporte.push("rechazo mostrado: " + !alerta.classList.contains("d-none") + " | " + alerta.textContent);

        contrasena.value = "";
        form.dispatchEvent(new SubmitEvent("submit", { bubbles: true, cancelable: true, submitter: document.getElementById("btn-submit") }));
        reporte.push("requiere contraseña: " + !alerta.classList.contains("d-none") + " | " + alerta.textContent);

        contrasena.value = "Docente2026!";
        form.dispatchEvent(new SubmitEvent("submit", { bubbles: true, cancelable: true, submitter: document.getElementById("btn-submit") }));
        const sesion = JSON.parse(localStorage.getItem("intranet_sesion"));
        reporte.push("sesion creada: " + (sesion && sesion.rol === "docente"));
        reporte.push("navegacion hacia dashboard: " + window.__navegaciones.includes("dashboard.html"));
      } catch (error) {
        reporte.push("FALLO: " + error.message + (window.__locationBloqueado ? " [location bloqueado: " + window.__locationBloqueado + "]" : ""));
      }
      document.getElementById("resultados").textContent = reporte.join("\n");
    });
  </script>
</body>
</html>
