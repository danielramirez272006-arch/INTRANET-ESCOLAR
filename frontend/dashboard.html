<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Panel de la Intranet Educativa según el rol del usuario.">
  <meta name="theme-color" content="#1e1b4b">
  <title>Intranet Educativa</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%234f46e5'/><path d='M32 14 8 24l24 10 24-10z' fill='%23fff'/><path d='M20 34v10c0 3 6 6 12 6s12-3 12-6V34l-12 5z' fill='%23fff'/></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>
  <nav class="navbar navbar-dark barra-superior fixed-top">
    <div class="container-fluid">
      <div class="d-flex align-items-center gap-2">
        <button class="navbar-toggler d-lg-none border-0 p-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu-movil" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
          <i class="bi bi-mortarboard"></i> Intranet Educativa
        </a>
      </div>
      <div class="d-flex align-items-center text-white">
        <div class="text-end me-3 d-none d-md-block">
          <div class="fw-semibold" id="usuario-nombre"></div>
          <small id="usuario-rol" class="opacity-75"></small>
        </div>
        <button class="btn btn-sm btn-outline-light" id="btn-cerrar-sesion" title="Cerrar sesión">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start d-lg-none" tabindex="-1" id="menu-movil">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title">Menú</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body p-2">
      <nav id="menu-movil-lista" class="nav flex-column"></nav>
    </div>
  </div>

  <aside class="sidebar d-none d-lg-flex" id="sidebar">
    <nav id="sidebar-lista" class="nav flex-column"></nav>
    <div class="sidebar-footer">
      <button class="btn btn-sm btn-outline-light w-100" id="btn-restablecer">
        <i class="bi bi-arrow-counterclockwise"></i> Restablecer datos de demo
      </button>
    </div>
  </aside>

  <main class="contenido" id="contenido" tabindex="-1">
    <div class="container-fluid p-3 p-md-4">
      <div id="vista-inicio" class="view"></div>
      <div id="vista-calificaciones" class="view d-none"></div>
      <div id="vista-asistencia" class="view d-none"></div>
      <div id="vista-comunicados" class="view d-none"></div>
      <div id="vista-reservas" class="view d-none"></div>
      <div id="vista-calendario" class="view d-none"></div>
      <div id="vista-materiales" class="view d-none"></div>
      <div id="vista-horarios" class="view d-none"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/modulos/inicio.js"></script>
  <script src="js/modulos/calificaciones.js"></script>
  <script src="js/modulos/asistencia.js"></script>
  <script src="js/modulos/comunicados.js"></script>
  <script src="js/modulos/reservas.js"></script>
  <script src="js/modulos/consultas.js"></script>
</body>
</html>
