<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Panel de la Intranet Escolar - Liceo San Miguel">
  <meta name="theme-color" content="#0f172a">
  <title>Portal Académico · Liceo Escolar San Miguel</title>
  <link rel="icon" href="img/escudo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido principal</a>

  <!-- Navbar Académico -->
  <nav class="navbar navbar-dark barra-superior fixed-top">
    <div class="container-fluid px-3">
      <div class="d-flex align-items-center gap-3">
        <button class="navbar-toggler d-lg-none border-0 p-1" type="button" data-bs-toggle="offcanvas" data-bs-target="#menu-movil" aria-label="Abrir menú de navegación">
          <span class="navbar-toggler-icon"></span>
        </button>
        <a class="navbar-brand d-flex align-items-center gap-2" href="dashboard.html">
          <img src="img/escudo.png" alt="Escudo" style="height:32px;" class="me-1">
          <span class="d-none d-sm-inline">Liceo Escolar San Miguel</span>
          <span class="d-sm-none">Liceo San Miguel</span>
        </a>
        <span class="badge-ciclo d-none d-md-inline-block">
          <i class="bi bi-award-fill text-warning me-1"></i> Ciclo Lectivo 2026
        </span>
      </div>

      <div class="d-flex align-items-center text-white gap-3">
        <div class="text-end d-none d-md-block">
          <div class="fw-bold fs-6 lh-sm" id="usuario-nombre"></div>
          <div id="usuario-rol-badge"></div>
        </div>
        <div class="avatar-inicial" id="usuario-avatar-nav"><i class="bi bi-person-fill"></i></div>
        <button class="btn btn-sm btn-outline-light ms-1" id="btn-cerrar-sesion" title="Cerrar sesión activa">
          <i class="bi bi-box-arrow-right"></i> <span class="d-none d-sm-inline">Salir</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Menú lateral móvil -->
  <div class="offcanvas offcanvas-start d-lg-none" tabindex="-1" id="menu-movil">
    <div class="offcanvas-header border-bottom bg-dark text-white">
      <div class="d-flex align-items-center gap-2">
        <img src="img/escudo.png" alt="Escudo" style="height:28px;">
        <h5 class="offcanvas-title fw-bold fs-6">Menú Académico</h5>
      </div>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body p-2 bg-dark">
      <nav id="menu-movil-lista" class="nav flex-column"></nav>
    </div>
  </div>

  <!-- Sidebar para Escritorio -->
  <aside class="sidebar d-none d-lg-flex" id="sidebar">
    <div id="sidebar-lista" class="d-flex flex-column h-100"></div>
    <div class="sidebar-footer">
      <button class="btn btn-sm btn-outline-light w-100 py-2 small" id="btn-restablecer">
        <i class="bi bi-arrow-counterclockwise me-1"></i> Restablecer Demo
      </button>
    </div>
  </aside>

  <!-- Contenedor Principal de Vistas -->
  <main class="contenido" id="contenido" tabindex="-1">
    <div class="container-fluid p-3 p-md-4">
      <div id="vista-inicio" class="view"></div>
      <div id="vista-calificaciones" class="view d-none"></div>
      <div id="vista-asistencia" class="view d-none"></div>
      <div id="vista-comunicados" class="view d-none"></div>
      <div id="vista-reservas" class="view d-none"></div>
      <div id="vista-calendario" class="view d-none"></div>
      <div id="vista-materiales" class="view d-none"></div>
      <div id="vista-horarios" class="view d-none"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/modulos/inicio.js"></script>
  <script src="js/modulos/calificaciones.js"></script>
  <script src="js/modulos/asistencia.js"></script>
  <script src="js/modulos/comunicados.js"></script>
  <script src="js/modulos/reservas.js"></script>
  <script src="js/modulos/consultas.js"></script>
</body>
</html>
