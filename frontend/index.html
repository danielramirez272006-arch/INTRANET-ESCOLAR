<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acceso a la Intranet Educativa para docentes, estudiantes y familias.">
  <meta name="theme-color" content="#1e1b4b">
  <title>Iniciar sesión · Intranet Educativa</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%234f46e5'/><path d='M32 14 8 24l24 10 24-10z' fill='%23fff'/><path d='M20 34v10c0 3 6 6 12 6s12-3 12-6V34l-12 5z' fill='%23fff'/></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-fondo">
  <main class="login-tarjeta">
    <div class="tarjeta p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="avatar-inicial avatar-grande mx-auto"><i class="bi bi-mortarboard"></i></div>
        <h1 class="h4 mt-3 mb-1">Intranet Educativa</h1>
        <p class="text-muted mb-0">Portal para docentes, estudiantes y familias</p>
      </div>
      <form id="form-login">
        <div class="mb-3">
          <label for="demo-usuario" class="form-label">Cuenta de demostración</label>
          <select id="demo-usuario" class="form-select"></select>
        </div>
        <div class="mb-3">
          <label for="contrasena" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="contrasena" placeholder="••••••••" autocomplete="current-password">
          <div class="form-text" id="ayuda-contrasena">Contraseña para todas las cuentas de demostración: <strong>demo2026</strong>.</div>
        </div>
        <div id="alerta-login" class="alert alert-danger py-2 d-none" role="alert"></div>
        <button class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right"></i> Ingresar</button>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
