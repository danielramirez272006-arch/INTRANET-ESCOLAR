<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acceso a la Intranet Educativa del Liceo Escolar San Miguel para docentes, estudiantes y familias.">
  <meta name="theme-color" content="#0f172a">
  <title>Acceso Institucional · Intranet Escolar San Miguel</title>
  <link rel="icon" href="img/escudo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="login-fondo">
  <main class="login-tarjeta">
    <div class="tarjeta p-4 p-md-5 shadow-lg">
      <div class="text-center mb-4">
        <img src="img/escudo.png" alt="Escudo Liceo Escolar San Miguel" class="escudo-login mb-2">
        <span class="badge-ciclo d-inline-block mb-2 text-dark bg-warning-subtle border-warning-subtle">
          <i class="bi bi-award-fill text-warning me-1"></i> Ciclo Lectivo 2026
        </span>
        <h1 class="h4 fw-bold text-slate-900 mb-1">Liceo Escolar San Miguel</h1>
        <p class="text-muted small mb-0">Intranet Educativa &amp; Portal Académico</p>
      </div>

      <form id="form-login">
        <div class="mb-3">
          <label for="demo-usuario" class="form-label fw-semibold small text-muted">
            <i class="bi bi-person-badge me-1 text-primary"></i> Seleccionar Cuenta de Demostración
          </label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-circle text-primary"></i></span>
            <select id="demo-usuario" class="form-select border-start-0 ps-0"></select>
          </div>
        </div>

        <div class="mb-3">
          <label for="contrasena" class="form-label fw-semibold small text-muted">
            <i class="bi bi-lock me-1 text-primary"></i> Contraseña de Acceso
          </label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-primary"></i></span>
            <input type="password" class="form-control border-start-0 ps-0" id="contrasena" placeholder="••••••••"
              autocomplete="current-password">
          </div>
          <div class="form-text mt-2 small text-muted" id="ayuda-contrasena">
            <i class="bi bi-info-circle me-1 text-info"></i> Cada cuenta demo tiene una contraseña distinta. Consultá las credenciales en el README.
          </div>
        </div>

        <div id="alerta-login" class="alert alert-danger py-2 small d-none" role="alert"></div>

        <button class="btn btn-primary w-100 py-2.5 mb-3 fw-bold">
          <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar al Portal Académico
        </button>

        <div class="text-center pt-2 border-top">
          <small class="text-muted d-block" style="font-size:0.75rem;">
            <i class="bi bi-shield-check text-success me-1"></i> Conexión Autenticada y Protegida por Hash &amp; Sal
          </small>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/util.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
